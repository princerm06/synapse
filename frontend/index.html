<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Synapse</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="container">
    <header>
      <p class="eyebrow">YOUR SAVED KNOWLEDGE</p>
      <h1>Find what you remember.</h1>
      <p class="intro">
        Search by idea, detail, or vague memory. Synapse will find the pages you saved.
      </p>
    </header>

    <form id="search-form" role="search">
      <label class="sr-only" for="search-input">Search saved knowledge</label>
      <input
        id="search-input"
        type="search"
        placeholder="e.g. that article about cloud computing..."
        autocomplete="off"
        required
      >

      <button id="search-button" type="submit">Search</button>
    </form>

    <p id="status" aria-live="polite"></p>

    <section id="results" aria-label="Search results"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
