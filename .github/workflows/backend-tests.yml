name: Backend tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install pytest SQLAlchemy pgvector

      - name: Run backend unit tests
        run: python -m pytest tests/test_chunking.py tests/test_retrieval.py tests/test_evaluation.py tests/test_reprocessing.py -v
